<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EquiScore — Launching...</title>
  <script src="https://cdn.jsdelivr.net/npm/fhirclient@2.5.2/build/fhir-client.js"></script>
</head>
<body>
  <script>
    var redirectUri = window.location.origin + window.location.pathname.replace("launch.html", "index.html");
    var params = new URLSearchParams(window.location.search);
    
    if (params.get("iss")) {
      // EHR launch - server provided context
      FHIR.oauth2.authorize({
        client_id: "equiprs_app",
        scope: "launch launch/patient patient/Patient.read patient/Observation.read patient/Condition.read openid fhirUser",
        redirect_uri: redirectUri
      });
    } else {
      // Standalone launch - app picks the patient
      FHIR.oauth2.authorize({
        client_id: "equiprs_app",
        iss: "https://launch.smarthealthit.org/v/r4/fhir",
        scope: "launch/patient patient/Patient.read patient/Observation.read patient/Condition.read openid fhirUser",
        redirect_uri: redirectUri
      });
    }
  </script>
</body>
</html>
